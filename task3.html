<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 3. Bootstrap Validation Styles</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand bg-success" data-bs-theme="dark">
    <div class="container flex-wrap">
      <a class="navbar-brand" href="index.html">Assignment 4</a>
      <ul class="navbar-nav flex-wrap">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="task0.html">Task 0</a></li>
        <li class="nav-item"><a class="nav-link" href="task1.html">Task 1</a></li>
        <li class="nav-item"><a class="nav-link" href="task2.html">Task 2</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="task3.html">Task 3</a></li>
        <li class="nav-item"><a class="nav-link" href="task4.html">Task 4</a></li>
      </ul>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h1 class="h3 mb-3">Task 3. Bootstrap Validation Styles</h1>

        <form id="contactForm" action="#" novalidate>
          <div class="alert alert-success d-none success-message" role="alert">Form submitted successfully!</div>

          <div class="row g-3">
            <div class="col-md-6">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" name="name" placeholder="Your full name"
                     required minlength="2" maxlength="50"
                     data-required="Name is required" data-invalid="Name must be at least 2 characters">
              <div class="valid-feedback">Looks good!</div>
              <div class="invalid-feedback">Name is required</div>
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com"
                     required
                     data-required="Email is required" data-invalid="Please enter a valid email address">
              <div class="valid-feedback">Looks good!</div>
              <div class="invalid-feedback">Email is required</div>
            </div>

            <div class="col-12">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here"
                        required minlength="10" maxlength="200"
                        data-required="Message is required" data-invalid="Message must be at least 10 characters"></textarea>
              <div class="valid-feedback">Looks good!</div>
              <div class="invalid-feedback">Message is required</div>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-success">Submit</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="validation.js"></script>
</body>
</html>

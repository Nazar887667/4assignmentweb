<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 1. Form with HTML5 Validation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand bg-success" data-bs-theme="dark">
    <div class="container flex-wrap">
      <a class="navbar-brand" href="index.html">Assignment 4</a>
      <ul class="navbar-nav flex-wrap">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="task0.html">Task 0</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="task1.html">Task 1</a></li>
        <li class="nav-item"><a class="nav-link" href="task2.html">Task 2</a></li>
        <li class="nav-item"><a class="nav-link" href="task3.html">Task 3</a></li>
        <li class="nav-item"><a class="nav-link" href="task4.html">Task 4</a></li>
      </ul>
    </div>
  </nav>

  <main class="container my-4">
    <h1 class="h3 text-center mb-3">Task 1. Form with HTML5 Validation</h1>

    <form class="simple-form" action="#" method="get">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required minlength="2" maxlength="50"
             pattern="[\p{L} '\-]{2,50}" title="Letters only, 2 to 50 characters">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required maxlength="100">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required minlength="10" maxlength="200"></textarea>

      <button type="submit">Submit</button>
    </form>

    <div class="simple-form mt-3">
      <p class="mb-1"><strong>Built-in validation used:</strong></p>
      <ul class="mb-0">
        <li>Name: <code>required</code>, <code>minlength</code>, <code>maxlength</code>, <code>pattern</code></li>
        <li>Email: <code>required</code>, <code>type="email"</code>, <code>maxlength</code></li>
        <li>Message: <code>required</code>, <code>minlength</code>, <code>maxlength</code></li>
      </ul>
    </div>
  </main>

</body>
</html>
